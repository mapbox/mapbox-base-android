[versions]
minSdkVersion = "19"
targetSdkVersion = "29"
compileSdkVersion = "29"

incap = "0.3"
tools = "4.1.3"
kotlin = "1.7.20"
androidX = "1.1.0"
license = "0.9.0"
kotlinPoet = "1.6.0"
serviceProvider = "1.0-rc7"
dokka = "1.7.20"
sdkRegistry = "0.7.0"
mockk = "1.10.0"
junit = "1.1.2"
navigationBase = "1.0.0-rc.6"


[libraries]
kotlin = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
annotations = { module = "androidx.annotation:annotation", version.ref = "androidX" }
kotlinPoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinPoet" }
serviceProvider = { module = "com.google.auto.service:auto-service", version.ref = "serviceProvider" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
junit = { module = "androidx.test.ext:junit", version.ref = "junit" }
navigationBase = { module = "com.mapbox.navigation:base", version.ref = "navigationBase" }
incapRuntime = { module = "net.ltgt.gradle.incap:incap", version.ref = "incap" }
incapProcessor = { module = "net.ltgt.gradle.incap:incap-processor", version.ref = "incap" }


[plugins]
android = { id = "com.android.tools.build:gradle", version.ref = "tools" }
kotlin = { id = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
license = { id = "com.jaredsburrows:gradle-license-plugin", version.ref = "license" }
dokka = { id = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
sdkRegistry = { id = "com.mapbox.gradle.plugins:sdk-registry", version.ref = "sdkRegistry" }
